{{- if .Values.runtimeClass.create }}
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: {{ .Values.runtimeClass.name }}
  labels:
    {{- include "gvisor-installer.labels" . | nindent 4 }}
handler: {{ .Values.gvisor.handler }}
scheduling:
  nodeSelector:
    {{ .Values.nodeLabel }}: "true"
    {{- with .Values.runtimeClass.nodeSelector }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.runtimeClass.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- with .Values.runtimeClass.overhead }}
overhead:
  podFixed:
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- end }}
