apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gvisor-installer.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gvisor-installer.labels" . | nindent 4 }}
---
# The installer labels its own node once gVisor is installed there.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gvisor-installer.fullname" . }}
  labels:
    {{- include "gvisor-installer.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "gvisor-installer.fullname" . }}
  labels:
    {{- include "gvisor-installer.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "gvisor-installer.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "gvisor-installer.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.uninstall.enabled }}
---
# The uninstall dispatcher deletes the DaemonSet and runs one Job per node.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "gvisor-installer.fullname" . }}-uninstall
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gvisor-installer.labels" . | nindent 4 }}
rules:
  - apiGroups: [apps]
    resources: [daemonsets]
    verbs: [get, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "gvisor-installer.fullname" . }}-uninstall
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gvisor-installer.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "gvisor-installer.fullname" . }}-uninstall
subjects:
  - kind: ServiceAccount
    name: {{ include "gvisor-installer.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
