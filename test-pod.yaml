apiVersion: v1
kind: Pod
metadata:
  name: test-gvisor-pod
spec:
  runtimeClassName: gvisor
  # Replace this value with a node on which the installer has completed.
  nodeSelector:
    kubernetes.io/hostname: container1
  restartPolicy: Never
  containers:
    - name: test
      image: docker.io/library/alpine:3.22
      command: ["sh", "-c", "uname -a; sleep 3600"]
