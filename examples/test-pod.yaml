apiVersion: v1
kind: Pod
metadata:
  name: gvisor-test
spec:
  runtimeClassName: gvisor
  restartPolicy: Never
  containers:
    - name: test
      image: docker.io/library/busybox:1.37
      # The kernel gVisor emulates, and its boot messages.
      command: ["sh", "-c", "uname -r; dmesg | head -3; sleep 3600"]
