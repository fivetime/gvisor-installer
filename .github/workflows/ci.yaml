name: ci
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -s sh installer.sh ci/e2e.sh ci/e2e-crio.sh
      - uses: azure/setup-helm@v4
      - run: |
          helm lint charts/gvisor-installer
          helm template t charts/gvisor-installer >/dev/null
      # Flux hands a chart pulled by digest a version with build metadata
      # (0.1.1+59bed083c3ae); "+" is not valid in a label value or an image tag.
      - name: The chart renders with build metadata in its version
        run: |
          v=$(sed -n 's/^version: *//p' charts/gvisor-installer/Chart.yaml)
          helm package charts/gvisor-installer --version "$v+0123456789ab" -d /tmp/pkg
          helm template t "/tmp/pkg/gvisor-installer-$v+0123456789ab.tgz" > /tmp/r.yaml
          grep -n 'helm.sh/chart' /tmp/r.yaml | head -2
          grep -n "image: " /tmp/r.yaml | head -2
          ! grep -nE '(helm.sh/chart: .*\+|image: .*\+)' /tmp/r.yaml
          grep -q "image: ghcr.io/fivetime/gvisor-installer:$v\$" /tmp/r.yaml
      - name: The chart's appVersion is the gVisor release the image carries
        run: |
          test "$(cat GVISOR_RELEASE)" = "$(sed -n 's/^appVersion: *"\(.*\)"/\1/p' charts/gvisor-installer/Chart.yaml)"

  e2e-containerd:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg GVISOR_RELEASE="$(cat GVISOR_RELEASE)" -t gvisor-installer:e2e .
      - uses: helm/kind-action@v1
        with:
          config: ci/kind.yaml
      - run: kind load docker-image gvisor-installer:e2e --name chart-testing
      - run: NODE=chart-testing-control-plane ci/e2e.sh gvisor-installer e2e

  e2e-crio:
    needs: lint
    runs-on: ubuntu-24.04
    env:
      # CRI-O's packages: https://github.com/cri-o/packaging. gVisor's shim
      # needs CRI-O 1.37 or later.
      CRIO_VERSION: v1.37
      KUBERNETES_VERSION: v1.36
    steps:
      - uses: actions/checkout@v4
      - name: Install CRI-O and crictl
        run: |
          curl -fsSL "https://download.opensuse.org/repositories/isv:/cri-o:/stable:/$CRIO_VERSION/deb/Release.key" |
            sudo gpg --dearmor -o /etc/apt/keyrings/cri-o.gpg
          echo "deb [signed-by=/etc/apt/keyrings/cri-o.gpg] https://download.opensuse.org/repositories/isv:/cri-o:/stable:/$CRIO_VERSION/deb/ /" |
            sudo tee /etc/apt/sources.list.d/cri-o.list
          curl -fsSL "https://pkgs.k8s.io/core:/stable:/$KUBERNETES_VERSION/deb/Release.key" |
            sudo gpg --dearmor -o /etc/apt/keyrings/kubernetes.gpg
          echo "deb [signed-by=/etc/apt/keyrings/kubernetes.gpg] https://pkgs.k8s.io/core:/stable:/$KUBERNETES_VERSION/deb/ /" |
            sudo tee /etc/apt/sources.list.d/kubernetes.list
          sudo apt-get update
          sudo apt-get install -y cri-o cri-tools
          sudo systemctl start crio
          printf 'runtime-endpoint: unix:///run/crio/crio.sock\ntimeout: 60\n' | sudo tee /etc/crictl.yaml
          sudo crictl version
      - run: docker build --build-arg GVISOR_RELEASE="$(cat GVISOR_RELEASE)" -t gvisor-installer:e2e .
      - run: ci/e2e-crio.sh gvisor-installer:e2e
      - if: failure()
        run: |
          sudo journalctl -u crio -n 30 --no-pager
          sudo crictl ps -a || true
          for f in /tmp/runsc/*; do echo "=== $f"; sudo tail -40 "$f"; done

  publish:
    needs: [e2e-containerd, e2e-crio]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          echo "release=$(cat GVISOR_RELEASE)" >> "$GITHUB_OUTPUT"
          echo "chart=$(sed -n 's/^version: *//p' charts/gvisor-installer/Chart.yaml)" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Every push: sha-<commit>. A v* tag: the chart's version, which is the
      # chart's default image tag.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: GVISOR_RELEASE=${{ steps.v.outputs.release }}
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.chart }}
            dev.gvisor.release=${{ steps.v.outputs.release }}
          tags: |
            ghcr.io/${{ github.repository }}:sha-${{ steps.v.outputs.sha }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('ghcr.io/{0}:{1}', github.repository, steps.v.outputs.chart) || '' }}
      - name: Publish the chart
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
          CHART: ${{ steps.v.outputs.chart }}
        run: |
          test "$TAG" = "v$CHART" || { echo "tag $TAG does not match chart version $CHART" >&2; exit 1; }
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package charts/gvisor-installer
          helm push "gvisor-installer-$CHART.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
