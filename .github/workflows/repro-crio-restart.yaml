name: repro-crio-restart
on:
  push:
    branches: [crio-vm-restart-repro]
  workflow_dispatch:
jobs:
  repro:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        runtime: [gvisor]
        killmode: [default]
        # The tip of release-1.37, which has #10422 (not released yet).
        crio: [b54e8d1dffac60f32b67794d942e84ff48d89a13]
    env:
      CRIO_VERSION: v1.37
      KUBERNETES_VERSION: v1.36
      KATA_VERSION: 4.3.1
    steps:
      - uses: actions/checkout@v4
      - name: Install CRI-O and crictl
        run: |
          curl -fsSL "https://download.opensuse.org/repositories/isv:/cri-o:/stable:/$CRIO_VERSION/deb/Release.key" |
            sudo gpg --dearmor -o /etc/apt/keyrings/cri-o.gpg
          echo "deb [signed-by=/etc/apt/keyrings/cri-o.gpg] https://download.opensuse.org/repositories/isv:/cri-o:/stable:/$CRIO_VERSION/deb/ /" |
            sudo tee /etc/apt/sources.list.d/cri-o.list
          curl -fsSL "https://pkgs.k8s.io/core:/stable:/$KUBERNETES_VERSION/deb/Release.key" |
            sudo gpg --dearmor -o /etc/apt/keyrings/kubernetes.gpg
          echo "deb [signed-by=/etc/apt/keyrings/kubernetes.gpg] https://pkgs.k8s.io/core:/stable:/$KUBERNETES_VERSION/deb/ /" |
            sudo tee /etc/apt/sources.list.d/kubernetes.list
          sudo apt-get update
          sudo apt-get install -y cri-o cri-tools
          curl -fsSL https://raw.githubusercontent.com/cri-o/packaging/main/get | sudo bash -s -- -t ${{ matrix.crio }}
          sudo systemctl daemon-reload
          systemctl cat crio | head -20
          sudo systemctl restart crio
          crio --version
          printf 'runtime-endpoint: unix:///run/crio/crio.sock\ntimeout: 60\n' | sudo tee /etc/crictl.yaml
      - if: matrix.runtime == 'gvisor'
        run: docker build --build-arg GVISOR_RELEASE="$(cat GVISOR_RELEASE)" -t gvisor-installer:repro .
      - if: matrix.runtime != 'gvisor'
        run: |
          ls -l /dev/kvm
          sudo chmod 666 /dev/kvm
          curl -fsSL -o /tmp/kata-static.tar.zst \
            "https://github.com/kata-containers/kata-containers/releases/download/$KATA_VERSION/kata-static-$KATA_VERSION-amd64.tar.zst"
          curl -fsSL -o /tmp/kata-go-static.tar.zst \
            "https://github.com/kata-containers/kata-containers/releases/download/$KATA_VERSION/kata-go-static-$KATA_VERSION-amd64.tar.zst"
      - run: ci/repro-crio-restart.sh ${{ matrix.runtime }} ${{ matrix.killmode }} gvisor-installer:repro
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crio-log-${{ matrix.runtime }}-${{ matrix.killmode }}-fixed
          path: /tmp/crio.log
